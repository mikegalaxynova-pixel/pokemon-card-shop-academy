<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">🃏 {{ site.title }}</a>
  <nav class="topnav">
    <a href="{{ '/start/' | relative_url }}">学习路径</a>
    <a href="{{ '/tools/' | relative_url }}">工具箱</a>
    <a href="{{ '/glossary/' | relative_url }}">术语表</a>
  </nav>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="site-footer">
  <p>内容为学习整理，不构成法律、税务或投资建议；法规与价格以官方和主管机关最新信息为准。</p>
  <p><a href="{{ '/sources/' | relative_url }}">信息源</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
</footer>
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
